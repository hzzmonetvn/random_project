<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030506" />
    <meta
      name="description"
      content="A little universe made from ordinary days, held together by every moment still to come."
    />
    <title>Days Together — Still Counting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="scene" aria-label="Days together, still counting">
      <canvas id="architecture" aria-hidden="true"></canvas>
      <div class="film-grain" aria-hidden="true"></div>
      <div class="edge-shade" aria-hidden="true"></div>

      <section class="title-lockup" aria-live="polite">
        <p class="day-count" aria-label="Days together">
          <span id="days">251</span>
        </p>
        <p class="together">days together</p>
        <p class="date-line">
          <span>since</span>
          <time id="start-date" datetime="2026-02-21">2026.02.21</time>
          <span class="divider" aria-hidden="true">·</span>
          <span>still counting</span>
        </p>
        <button class="enter-button" id="enter" type="button" aria-haspopup="dialog">
          <span>enter</span>
          <i aria-hidden="true"></i>
        </button>
      </section>

      <dialog class="memory-dialog" id="memory-dialog" aria-labelledby="memory-title">
        <button class="close-button" id="close-dialog" type="button" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
        <p class="dialog-eyebrow">A SMALL UNIVERSE, STILL IN MOTION</p>
        <h1 id="memory-title">The story<br />is still unfolding.</h1>
        <p class="dialog-copy">
          Some days become memories before we notice. Here’s to all the moments still ahead.
        </p>
        <p class="dialog-date">
          <span id="dialog-days">251</span> days, and counting
        </p>
        <button class="return-button" id="return" type="button">return to the beginning</button>
      </dialog>

      <p class="sound-note" aria-hidden="true">A PLACE BETWEEN THE STARS</p>
    </main>
  </body>
</html>
